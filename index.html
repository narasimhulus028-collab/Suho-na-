<!DOCTYPE html>

      <li>📞 Voice Calls</li>
    </ul>

    <button id="subscribeBtn">
      Subscribe
    </button>

    <button id="closePopup">
      Close
    </button>

  </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
